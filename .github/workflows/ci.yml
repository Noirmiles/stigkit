# Build and security pipeline for stigkit.
#
# Layout rationale
# ----------------
# Four independent security gates run in parallel with the test matrix, each
# owning one class of risk:
#
#   sast      - flaws in code we wrote            (Semgrep)
#   sca       - flaws in code we imported         (pip-audit)
#   secrets   - credentials committed by mistake  (gitleaks)
#   iac/fs    - misconfiguration and vulnerable   (Trivy)
#               files in the tree
#
# They are separate jobs rather than steps in one so that a Semgrep failure
# still tells you whether your dependencies are clean. A single "security" job
# that stops at the first failure hides the other three findings and turns a
# ten-minute fix into three sequential pipeline runs.
#
# Supply chain
# ------------
# Every third-party action is pinned to a full commit SHA, not a tag. Tags are
# mutable: `@v4` is a promise from the action's owner that they will not change
# what v4 points at, and a compromised or careless maintainer breaks that
# promise silently. The SHA is the only immutable reference GitHub offers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependencies rot without any commit from us: a CVE published on Tuesday
    # makes Monday's green build wrong. Re-run the gates weekly.
    - cron: "17 6 * * 1"

# Least privilege by default. Jobs that need more request it explicitly, so the
# blast radius of a compromised action is visible in the diff that grants it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Enforce coverage floor
        # A floor, not a target. It stops coverage sliding while nobody is
        # looking; it does not claim 90% coverage means the code is correct.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          pct = round(rate * 100, 2)
          print(f"line coverage: {pct}%")
          sys.exit(0 if pct >= 90 else 1)
          PY

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Scan
        # Explicit rulesets rather than --config=auto: auto resolves rules from
        # the network at run time, so the checks applied to a given commit are
        # not reproducible and not reviewable.
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --metrics=off \
            --error

      - name: Upload SARIF
        # Private repos need GitHub Advanced Security for Code Scanning upload.
        # The scan itself already failed the job above if it found anything, so
        # a failed upload must not mask a passing scan.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit

      - name: Audit installed dependencies
        # Audits the resolved environment, not just the declared ranges, so a
        # vulnerable transitive pin is caught rather than assumed safe.
        #
        # --skip-editable excludes stigkit itself: it is installed editable and
        # is not on PyPI, so there is no advisory data to audit it against.
        # Note the absence of --strict, which is deliberate -- --strict fails
        # the run on any package it *skipped*, which would mean this gate could
        # never pass on a project that installs itself.
        run: pip-audit --skip-editable --desc

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. A secret deleted in the working tree is still live if
          # it is reachable in an earlier commit -- scanning only the tip is the
          # single most common way secret scanning gives false assurance.
          fetch-depth: 0

      # The official gitleaks-action derives a commit range from the push
      # event and errors out when there is no valid range -- on a repository's
      # first push it scanned zero bytes and still exited non-zero, which is a
      # failure mode that looks identical to a real finding. Running the binary
      # directly scans full history deterministically, and pinning the version
      # plus verifying the checksum is a stronger supply-chain position than
      # trusting a mutable action tag.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history for secrets
        # --redact so a detected secret is not echoed into public build logs,
        # which would publish the very thing the gate exists to catch.
        run: gitleaks git . --redact --verbose --exit-code 1

  filesystem:
    name: Filesystem & config (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # trivy-action forces a bad choice: its newest release (v0.36.0, April) is
      # four months behind its own master, so pinning the tag runs an older
      # scanner, and pinning master leaves a SHA that no tag can vouch for --
      # the one pin in this file a reviewer could not audit. Installing the
      # Trivy release directly removes the choice. The version is explicit, the
      # download is checksum-verified, and there is one less third-party action
      # holding a token. Same reasoning as the gitleaks job above.
      #
      # Bump both values together; the checksum is published by the Trivy
      # release at trivy_<version>_checksums.txt.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$url" -o trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy scan
        # Exits 1 on a CRITICAL/HIGH finding. The upload step below is
        # if: always(), so the SARIF still reaches Code Scanning when it does.
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy

  compliance-gate:
    name: STIG compliance gate (dogfood)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Generate synthetic scan data
        # This repository contains no scan data. The sample set is built here,
        # from a deterministic generator, every run.
        run: python examples/generate_sample_data.py

      - name: Compliance summary to the job page
        # Written before the gate runs, so the posture is visible on the run
        # page even when -- especially when -- the next step fails the build.
        run: |
          stigkit scan examples/current --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Emit SARIF
        run: stigkit scan examples/current --format sarif --output stig.sarif

      - name: Upload STIG findings to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: stig.sarif
          category: stig-compliance

      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-reports
          path: stig.sarif
          retention-days: 30

      - name: Gate on CAT I findings
        # The demonstration of the point: a CAT I open finding fails the build.
        # `continue-on-error` because the sample data is randomised and is meant
        # to show the gate firing, not to hold this repo to a STIG baseline it
        # does not have. A real pipeline drops this line -- that is the whole
        # difference between a report and a control.
        continue-on-error: true
        run: stigkit scan examples/current --fail-on cat1 --format table
